paths:
  /api/products:
###-GET
    get:
      ###-COOKIE POR OPERACIÓN:
      #security:
        #- cookieAuth: [Access_Cookie: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..ohQSCF84MvlyjpMGmtksCHxj-xy89k_6Q4dt8AvOlQ8]
      summary: Retorna la lista de productos.
      tags:
        - Products
      description: Esto retorna la lista completa de productos.
      responses:
        '200':   
          description: Lista de productos
          content:
            application/json:
              schema: 
                type: array
                items: 
                  type: string
        '404':    
          description: Error al obtener los productos
###-POST    
    post:
      ###-COOKIE POR OPERACIÓN:
      #security:
        #- cookieAuth: [Access_Cookie: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..zwRuX0-zZvYqHi_zmt-cfbGQ9LjtBQKjtkksk3OiGxU]
      summary: Insertar un producto al stock
      tags:
        - Products
      description: Esto inserta un nuevo producto al stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#components/requestBodies/createProducts'
      responses:
        "201":
          description: Producto creado correctamente.
          content:
            application/json:
              schema: 
                type: array
                items: 
                  type: string
        "500":
          description: Error al Insertar el producto.
###-PUT
  /api/products/{pid}:
    put:
      ###-COOKIE POR OPERACIÓN:
      #security:
        #- cookieAuth: [Access_Cookie: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..21jRqIOOQD2O3XJEBLyZKmasLW8TG8MFZsPd1gtxZD4]
      summary: Editar un producto del stock
      tags:
        - Products
      parameters:
        - name: pid
          in: path
          required: true
          description: Identificador(id) del producto a modificar.
      description: Esto modifica un producto del stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#components/requestBodies/upDateProducts'
      responses:
        "201":
          description: Producto modificado correctamente.
          content:
            application/json:
              schema: 
                type: array
                items: 
                  type: string
        "500":
          description: Error al modificar el producto.
###-DELETE
  /api/products/{id}:
    delete:
      ###-COOKIE POR OPERACIÓN:
      #security:
        #- cookieAuth: [Access_Cookie: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..ohQSCF84MvlyjpMGmtksCHxj-xy89k_6Q4dt8AvOlQ8]
      summary: Retorna Mensaje como resultado de la operación.
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador(id) del producto a Elimiar.
      description: Esto retorna una descripción corta del resultado de la operación.
      responses:
        '200':   
          description: Eliminación de producto.
          content:
            application/json:
              schema: 
                type: array
                items: 
                  type: string
        '404':    
          description: Error al eliminar el productos.         
###-COMPONENTS
components:
  requestBodies:
    createProducts:
      type: object
      properties:
        title:
          type: string
          description: Nombre del producto
        description:
          type: string
          description: Description corta del producto  
        price:
          type: float
          description: Precio del producto
        thumbnail: 
          type: array
          items: 
            type: string
            description: Imagenes del producto  
        code:
          type: string
          description: Codigo unico del producto
        stock:
          type: string
          description: Cantidad disponible del producto
        status:
          type: boolean
          description: Status del producto
        category:
          type: string
          description: Categoria del producto
      example:
        title: producto 8,
        description: producto 8 de la tienda,
        price: 18.90,
        thumbnail: https://pathProduct_8_img.sv],
        code: 180,
        stock: 56,
        status: false,
        category: Shoes
    upDateProducts:
      type: object
      properties:
        title:
          type: string
          description: Nombre del producto
        description:
          type: string
          description: Description corta del producto  
        price:
          type: float
          description: Precio del producto
        thumbnail: 
          type: array
          items: 
            type: string
            description: Imagenes del producto  
        stock:
          type: string
          description: Cantidad disponible del producto
        status:
          type: boolean
          description: Status del producto
        category:
          type: string
          description: Categoria del producto
      example:
        description: producto 8 discontinuo de la tienda,
        price: 118.90,
        stock: 66
###-COOKIE GLOBAL:
security:
  - cookieAuth: [Access_Cookie: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..21jRqIOOQD2O3XJEBLyZKmasLW8TG8MFZsPd1gtxZD4]